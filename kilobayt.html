<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10111b">
<title>Kilobayt Strike - Yapım Aşamasında</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #10111b;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    text-align: center;
    background-image:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, .017) 0 14px, transparent 14px 28px);
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #8b7cff;
    margin-bottom: 40px;
}
.logo span { color: white; }

.badge {
    display: inline-block;
    background: #f0a83c;
    color: #2a1c00;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .5px;
    padding: 7px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
}

h1 {
    font-size: 44px;
    letter-spacing: 1px;
    margin-bottom: 14px;
    line-height: 1.1;
}

p {
    color: #b8b7ce;
    font-size: 16px;
    line-height: 1.6;
    max-width: 460px;
    margin-bottom: 30px;
}

.bar {
    width: min(420px, 90vw);
    height: 8px;
    background: #24253a;
    border: 1px solid #34354c;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 12px;
}
.bar i {
    display: block;
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg, #7967f5, #b7aaff);
    border-radius: 20px;
}

.bar-text {
    color: #8a8ba3;
    font-size: 13px;
    margin-bottom: 34px;
}

a.back {
    display: inline-block;
    background: #7967f5;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 9px;
    transition: .2s;
}
a.back:hover { background: #9385ff; }

@media (max-width: 600px) {
    h1 { font-size: 32px; }
    p { font-size: 15px; }
}
</style>
</head>
<body>

<div class="logo">OYUN<span>HANE</span></div>

<div class="badge">YAPIM AŞAMASINDA</div>
<h1>Kilobayt Strike</h1>
<p>Takım tabanlı, hızlı tempolu nişancı modu üzerinde çalışıyoruz. Hazır olduğunda burada olacak.</p>

<div class="bar"><i></i></div>
<div class="bar-text">Geliştirme devam ediyor...</div>

<a class="back" href="index.html">OYUNHANE'YE DÖN</a>

</body>
</html>
