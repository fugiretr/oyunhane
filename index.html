
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OYUNHANE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial,sans-serif}
header{padding:25px 7%;background:#171827;border-bottom:1px solid #292b40}
.logo{font-size:30px;font-weight:900;color:#8b7cff}
.logo span{color:white}
main{max-width:1100px;margin:45px auto;padding:0 20px}
h1{font-size:32px}
.subtitle{color:#a7a8bd}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:30px}
.card{background:#1b1d2d;border:1px solid #303249;border-radius:15px;padding:22px;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#8b7cff}
.game-icon{font-size:55px}
.card h2{margin-bottom:8px}
.card p{color:#aaaabd;line-height:1.5}
button{background:#7967f5;color:white;border:0;border-radius:9px;padding:12px 20px;font-weight:bold;cursor:pointer}
button:hover{background:#9385ff}
#gameArea{display:none;margin-top:30px}
.gameTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
iframe{width:100%;height:650px;border:1px solid #444;border-radius:12px;background:#000}
footer{text-align:center;color:#777;padding:40px}
</style>
</head>
<body>
<header><div class="logo">OYUN<span>HANE</span></div></header>
<main>
<h1>Oyununu seç ve oynamaya başla!</h1>
<p class="subtitle">En sevdiğin tarayıcı oyunları tek bir yerde.</p>

<div class="games">
<div class="card">
<div class="game-icon">🔫</div>
<h2>Counter-Strike 1.6</h2>
<p>Klasik Counter-Strike deneyimini tarayıcında oyna!</p>
<button onclick="openGame()">OYNA</button>
</div>
</div>

<section id="gameArea">
<div class="gameTop">
<h2>🔫 Counter-Strike 1.6</h2>
<div>
<button onclick="newTab()">Yeni sekmede aç</button>
<button onclick="closeGame()">Kapat</button>
</div>
</div>
<iframe id="gameFrame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<p class="subtitle">Oyun açılmazsa "Yeni sekmede aç" butonunu kullan.</p>
</section>
</main>
<footer>OYUNHANE © 2026 - İyi eğlenceler!</footer>

<script>
const gameURL="https://portal.dersarasi.workers.dev/game/cs16-web";

function openGame(){
 document.getElementById("gameArea").style.display="block";
 document.getElementById("gameFrame").src=gameURL;
 document.getElementById("gameArea").scrollIntoView({behavior:"smooth"});
}
function closeGame(){
 document.getElementById("gameArea").style.display="none";
 document.getElementById("gameFrame").src="about:blank";
}
function newTab(){
 window.open(gameURL,"_blank");
}
</script>
</body>
</html>
