
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10111b">
<title>OYUNHANE - Tarayıcı Oyunları</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #10111b;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    background: #171827;
    border-bottom: 1px solid #292b40;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    color: #8b7cff;
    letter-spacing: 1px;
}

.logo span {
    color: white;
}

.header-text {
    color: #aaaabd;
    font-size: 14px;
}

main {
    max-width: 1150px;
    margin: 45px auto;
    padding: 0 22px;
}

.hero {
    background: linear-gradient(120deg, #242044, #171827);
    padding: 38px;
    border: 1px solid #383254;
    border-radius: 18px;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.hero p {
    color: #b8b7ce;
    line-height: 1.6;
}

.search-area {
    margin-top: 25px;
}

.search-area input {
    width: 100%;
    padding: 14px;
    background: #10111b;
    color: white;
    border: 1px solid #44415f;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
}

.search-area input:focus {
    border-color: #8b7cff;
}

.section-title {
    font-size: 23px;
    margin-bottom: 20px;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.category {
    padding: 10px 17px;
    border-radius: 20px;
    background: #202136;
    color: #c5c4d8;
    border: 1px solid #34354c;
    cursor: pointer;
}

.category.active,
.category:hover {
    background: #7967f5;
    color: white;
    border-color: #7967f5;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: #1b1d2d;
    border: 1px solid #303249;
    border-radius: 15px;
    padding: 22px;
    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #8b7cff;
}

.game-icon {
    height: 125px;
    background: linear-gradient(135deg, #29234e, #171827);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    margin-bottom: 18px;
}

.card h2 {
    font-size: 21px;
    margin-bottom: 10px;
}

.card p {
    color: #aaaabd;
    line-height: 1.5;
    font-size: 14px;
    min-height: 42px;
}

.play-button {
    display: block;
    width: 100%;
    margin-top: 18px;
    background: #7967f5;
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 13px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    text-align: center;
    text-decoration: none;
}

.play-button:hover {
    background: #9385ff;
}

.tag {
    display: inline-block;
    margin-top: 12px;
    color: #b7aaff;
    background: #302951;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
}

.no-results {
    display: none;
    color: #aaaabd;
    padding: 30px 0;
}

footer {
    border-top: 1px solid #292b40;
    text-align: center;
    color: #77798f;
    padding: 30px 15px;
    margin-top: 70px;
    font-size: 13px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .hero {
        padding: 25px;
    }

    .hero h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">OYUN<span>HANE</span></div>
    <div class="header-text">Ücretsiz tarayıcı oyunları</div>
</header>

<main>

<section class="hero">
    <h1>Oyun dünyasına hoş geldin! 🎮</h1>
    <p>Oyununu seç, tek tıkla eğlenceye başla.</p>

    <div class="search-area">
        <input
            type="text"
            id="searchInput"
            placeholder="Oyun ara..."
            oninput="filterGames()"
        >
    </div>
</section>

<h2 class="section-title">Kategoriler</h2>

<div class="categories">
    <button class="category active" onclick="filterCategory('all', this)">Tümü</button>
    <button class="category" onclick="filterCategory('action', this)">Aksiyon</button>
    <button class="category" onclick="filterCategory('fps', this)">FPS</button>
    <button class="category" onclick="filterCategory('other', this)">Diğer</button>
</div>

<h2 class="section-title">🎮 Oyunlar</h2>

<div class="games">

    <div class="card" data-name="counter strike 1.6 cs16" data-category="fps action">
        <div class="game-icon">🔫</div>
        <h2>Counter-Strike 1.6</h2>
        <p>Klasik Counter-Strike deneyimini tarayıcında oyna!</p>
        <span class="tag">FPS</span>

        <a
            class="play-button"
            href="https://portal.dersarasi.workers.dev/game/cs16-web"
            target="_blank"
            rel="noopener noreferrer"
        >OYNA</a>
    </div>

</div>

<p class="no-results" id="noResults">Aradığın oyun bulunamadı.</p>

</main>

<footer>
    OYUNHANE © 2026 | İyi eğlenceler!
</footer>

<script>
let selectedCategory = "all";

function filterCategory(category, button) {
    selectedCategory = category;

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");
    filterGames();
}

function filterGames() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const cards = document.querySelectorAll(".card");
    let visible = 0;

    cards.forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const categories = card.dataset.category.split(" ");

        const matchesSearch = name.includes(search);
        const matchesCategory =
            selectedCategory === "all" ||
            categories.includes(selectedCategory);

        if (matchesSearch && matchesCategory) {
            card.style.display = "block";
            visible++;
        } else {
            card.style.display = "none";
        }
    });

    document.getElementById("noResults").style.display =
        visible === 0 ? "block" : "none";
}
</script>

</body>
</html>
